# Compiles the Kotlin/Native iOS targets on a GitHub-hosted macOS runner.
#
# Why this exists: the project is developed on Windows, where nothing under
# shared/src/iosMain can be compiled at all — Kotlin/Native's Apple targets and the
# CocoaPods integration both require macOS. This workflow is the only place those
# files get type-checked, so treat a red run here as a real break even though the
# Android build is green.
#
# Deliberately does NOT build iosApp/: there is no .xcodeproj in the repo yet. The
# Gradle compile below covers all shared Kotlin, which is ~90% of the codebase.

name: iOS build

on:
  push:
    branches: [main, multiplatform]
    paths:
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'shared/**'
  workflow_dispatch:
    inputs:
      debug_shell:
        description: 'Pause the job and open an SSH shell into the macOS runner'
        type: boolean
        default: false

# A new push makes an in-flight run obsolete. macOS minutes bill at 10x on private
# repos, so cancelling superseded runs is worth the two lines.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Git on Windows does not preserve the executable bit, so gradlew arrives here
      # non-executable and would fail with "Permission denied".
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The cocoapods plugin declares FirebaseCore/Auth/Firestore, and cinterop for
      # those runs `pod install` against a synthetic project. Warming the spec repo
      # first turns an opaque mid-build failure into an obvious one.
      - name: Prime CocoaPods
        run: pod --version && pod repo update --silent

      # Compiles commonMain + iosMain for the simulator and for real devices. arm64
      # is included because device-only API availability differences do surface here.
      - name: Compile iOS targets
        run: |
          set -o pipefail
          ./gradlew :shared:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosArm64 \
            --stacktrace 2>&1 | tee /tmp/ios-build.log

      # Downloading job logs needs an authenticated token, and the run summary turns out NOT to be
      # exposed on the check run. Annotations are the one channel that is public on a public repo,
      # so the errors are emitted as a single ::error:: -- one annotation rather than one per line,
      # because GitHub caps how many it keeps per step. A workflow command has to occupy a single
      # line, hence the percent-escaping ('%' first, or it would corrupt the escapes that follow).
      - name: Publish compile errors as an annotation
        if: failure()
        run: |
          errors=$(grep -E '^e: |^FAILURE|Unresolved reference|error:' /tmp/ios-build.log | head -100 || true)
          if [ -z "$errors" ]; then errors=$(tail -80 /tmp/ios-build.log); fi
          escaped=$(printf '%s' "$errors" | sed -e 's/%/%25/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
          echo "::error title=Kotlin/Native compile errors::${escaped}"

      - name: Publish compile errors to run summary
        if: failure()
        run: |
          {
            echo '## Kotlin/Native compile errors'
            echo
            echo '```'
            grep -E '^e: |^FAILURE|^Caused by:|Unresolved reference|error:' /tmp/ios-build.log \
              | head -300 || echo '(no lines matched -- see tail below)'
            echo '```'
            echo
            echo '<details><summary>Last 120 lines</summary>'
            echo
            echo '```'
            tail -120 /tmp/ios-build.log
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run common tests
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      # Strictly opt-in: NOT on failure. Holding the runner open on every red build wastes 6 hours
      # of it and delays the next run. limit-access-to-actor is off because it requires an SSH key
      # on the GitHub profile, which this account has none of -- without it tmate prints a
      # password-based ssh command in the log instead, which is what you want here.
      - name: Debug shell
        if: ${{ inputs.debug_shell }}
        uses: mxschmitt/action-tmate@v3
