# Compiles the Kotlin/Native iOS targets on a GitHub-hosted macOS runner.
#
# Why this exists: the project is developed on Windows, where nothing under
# shared/src/iosMain can be compiled at all — Kotlin/Native's Apple targets and the
# CocoaPods integration both require macOS. This workflow is the only place those
# files get type-checked, so treat a red run here as a real break even though the
# Android build is green.
#
# Deliberately does NOT build iosApp/: there is no .xcodeproj in the repo yet. The
# Gradle compile below covers all shared Kotlin, which is ~90% of the codebase.

name: iOS build

on:
  push:
    branches: [main, multiplatform]
    paths:
      - 'shared/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'shared/**'
  workflow_dispatch:
    inputs:
      debug_shell:
        description: 'Pause the job and open an SSH shell into the macOS runner'
        type: boolean
        default: false

# A new push makes an in-flight run obsolete. macOS minutes bill at 10x on private
# repos, so cancelling superseded runs is worth the two lines.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Git on Windows does not preserve the executable bit, so gradlew arrives here
      # non-executable and would fail with "Permission denied".
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The cocoapods plugin declares FirebaseCore/Auth/Firestore, and cinterop for
      # those runs `pod install` against a synthetic project. Warming the spec repo
      # first turns an opaque mid-build failure into an obvious one.
      - name: Prime CocoaPods
        run: pod --version && pod repo update --silent

      # Compiles commonMain + iosMain for the simulator and for real devices. arm64
      # is included because device-only API availability differences do surface here.
      - name: Compile iOS targets
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosArm64 --stacktrace

      - name: Run common tests
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      # Opt-in only. Prints an ssh command in the log; connect from Windows to get a
      # real macOS shell and iterate on compile errors without pushing a commit for
      # each attempt. The job holds the runner until you exit or it times out.
      - name: Debug shell
        if: ${{ failure() || inputs.debug_shell }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
